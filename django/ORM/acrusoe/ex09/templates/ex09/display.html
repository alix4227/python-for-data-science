<!DOCTYPE html>
<html>
  <head>
    <title>Ex00 : Markdown Cheatsheet.</title>
    <style>
      span {
        text-decoration: underline;
         font-weight: lighter;
      }

      .titre {
        text-align: center;
        font-weight: lighter;
      }
      .titre h1,
      .titre h2 {
        margin: 0;
      }
      
      i {
        color: grey;
        font-size:medium;
      }
      h3 {
        font-family: Cambria;
      }
       h2 {
        font-family: Cambria;
         text-align: center;
      }
      p{
        text-align: center;
      }
      table {
        width: 90%;
        max-width: 1000px;
        margin: 20px auto;
        table-layout: fixed;
        border-collapse: collapse;
        color: black;
      }
      th, td {
        border: 1px solid;
        padding: 8px 10px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        vertical-align: top;
      }
      #sous_titre {
        color: blue;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
  <center>
    {% if not films %}
        <h2>{{result}}</h2>
    {% else %}
        <table>
            <tr>
                {%for header in headers%}
                <th>{{header}}</th>
                {%endfor%}
            </tr>
            {%for film in films%}
            <tr>
                <td style="height: 40px; width: 80px;">{{film.episode_nb}}</td>
                <td style="height: 40px; width: 80px;">{{film.title}}</td>
                <td style="height: 40px; width: 80px;">{{film.director}}</td>
                <td style="height: 40px; width: 80px;">{{film.producer}}</td>
                <td style="height: 40px; width: 80px;">{{film.release_date}}</td>
                <td style="height: 40px; width: 80px;">{{film.opening_crawl}}</td>
                <td style="height: 40px; width: 80px;">{{film.created}}</td>
                <td style="height: 40px; width: 80px;">{{film.updated}}</td>
            </tr>
            {%endfor%}
        </table>
    {%endif%}
</center>
</body>
</html>
