<!DOCTYPE html>
<html>
  <head>
    <title>Ex00 : Markdown Cheatsheet.</title>
    <style>
      span {
        text-decoration: underline;
         font-weight: lighter;
      }

      .titre {
        text-align: center;
        font-weight: lighter;
      }
      .titre h1,
      .titre h2 {
        margin: 0;
      }
      
      i {
        color: grey;
        font-size:medium;
      }
      h3 {
        font-family: Cambria;
      }
       h2 {
        font-family: Cambria;
         text-align: center;
      }
      p{
        text-align: center;
      }
      table {
        width: 90%;
        max-width: 1000px;
        margin: 20px auto;
        table-layout: fixed;
        border-collapse: collapse;
        color: black;
      }
      th, td {
        border: 1px solid;
        padding: 8px 10px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        vertical-align: top;
      }
      #sous_titre {
        color: blue;
        font-weight: 900;
      }
    ul {
    display: flex;
    gap: 10px;
    list-style: none;
}
    </style>
  </head>
  <body>
  <center>
{% if login %}
     <nav class="menu">
  <ul>
    <div><a href="{% url 'deconnexion' %}">Deconnexion</a></div>
  </ul>
  <div>Hello {{username}}!</div>
</nav>
{% else %}
    <nav class="menu">
  <ul>
    <div><a href="{% url 'index' %}">LIFE PRO TIPS</a></div>
    <div><a href="{% url 'subscribe' %}">Subscribe</a></div>
    <div><a href="{% url 'login_view' %}">Login</a></div>
  </ul>
  <div>Hello {{username}}!</div>
</nav>
{% endif %}
  </center>
  </body>
</html>
