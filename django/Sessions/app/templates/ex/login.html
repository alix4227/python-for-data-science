<!DOCTYPE html>
<html>
  <head>
    <title>Ex00 : Markdown Cheatsheet.</title>
    <style>
      span {
        text-decoration: underline;
         font-weight: lighter;
      }

      .titre {
        text-align: center;
        font-weight: lighter;
      }
      .titre h1,
      .titre h2 {
        margin: 0;
      }
      
      i {
        color: grey;
        font-size:medium;
      }
      h3 {
        font-family: Cambria;
      }
       h2 {
        font-family: Cambria;
         text-align: center;
      }
      p{
        text-align: center;
      }
      table {
        width: 90%;
        max-width: 1000px;
        margin: 20px auto;
        table-layout: fixed;
        border-collapse: collapse;
        color: black;
      }
      th, td {
        border: 1px solid;
        padding: 8px 10px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        vertical-align: top;
      }
      #sous_titre {
        color: blue;
        font-weight: 900;
      }
      ul {
    display: flex;
    gap: 10px;
    list-style: none;
}
    </style>
  </head>
  <body>
  <center>
 <div>{{error_message}}</div>
    <nav class="menu">
        <ul>
            <div><a href="{% url 'index' %}">LIFE PRO TIPS</a></div>
            <div><a href="{% url 'subscribe' %}">Subscribe</a></div>
            <div><a href="{% url 'login_view' %}">Login</a></div>
        </ul>
    </nav>
    <form action="{% url 'login_view' %}" method="post" class="form">
      {% csrf_token %}
  <div class="form">
    <label for="name">Entrez votre nom&nbsp;: </label>
    <input type="text" name="username" id="username" value="{{ username }}" required />
  </div>
  <div class="form">
    <label for="password">Entrez votre mot de passe&nbsp;: </label>
    <input type="password" name="password" id="password" required />
  </div>
  <div class="form">
    <input type="submit" value="Login" />
  </div>
</form>
  </center>
  </body>
</html>
