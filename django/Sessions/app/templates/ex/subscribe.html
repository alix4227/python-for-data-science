<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" 
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>Tips</title>
    <style>
      span {
        text-decoration: underline;
         font-weight: lighter;
      }

      .titre {
        text-align: center;
        font-weight: lighter;
      }
      .titre h1,
      .titre h2 {
        margin: 0;
      }
      
      i {
        color: grey;
        font-size:medium;
      }
      h3 {
        font-family: Cambria;
      }
       h2 {
        font-family: Cambria;
         text-align: center;
      }
      p{
        text-align: center;
      }
      table {
        width: 90%;
        max-width: 1000px;
        margin: 20px auto;
        table-layout: fixed;
        border-collapse: collapse;
        color: black;
      }
      th, td {
        border: 1px solid;
        padding: 8px 10px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        vertical-align: top;
      }
      #sous_titre {
        color: blue;
        font-weight: 900;
      }
      ul {
    display: flex;
    gap: 10px;
    list-style: none;
}
    </style>
  </head>
  <body>
<div>{{error_message}}</div>
<nav class="navbar navbar-dark bg-primary">
  <ul class="navbar-nav flex-row gap-3">
    <li class="nav-item active">
        <a class="navbar-brand" href="{% url 'index' %}">LIFE PRO TIPS</a></div>
    </li>
    <li class="nav-item active">
        <a class="nav-link" href="{% url 'subscribe' %}">Subscribe<span class="sr-only">(current)</span></a>
    </li>
    <li class="nav-item active">
        <a class="nav-link" href="{% url 'login_view' %}">Login<span class="sr-only">(current)</span></a>
    </li>
  </ul>
</nav>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <form action="{% url 'subscribe' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" class="form-control" name="username" id="username" value="{{ username }}" placeholder="Entrez votre nom" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" class="form-control" name="password" id="password" placeholder="Entrez votre mot de passe" required>
        </div>
        <div class="form-group">
          <label for="password_verification">Confirmez le mot de passe</label>
          <input type="password" class="form-control" name="password_verification" id="password_verification" placeholder="Entrez à nouveau votre mot de passe" required>
        </div>
        <button type="submit" class="btn btn-primary">S'abonner !</button>
      </form>

    </div>
  </div>
</div>
  </body>
</html>
