{% extends "base.html" %}
{% block title %}djangoAdvanced: Display{% endblock %}
{%block content%}
<center>
<nav>
    <a href="{% url 'createArticle' %}">Publish Article</a>
</nav>     
<table>
    <tr>
    {%for header in headers%}
        <th>{{header}}</th>
    {%endfor%}
    </tr>
    {%for item in articles_objects%}
    <tr>
        <td style="height: 40px; width: 80px;"><a href="{% url 'detail' item.id %}">{{item.title}}</a></td>
        <td style="height: 40px; width: 80px;">{{item.created}}</td>
        <td style="height: 40px; width: 80px;">{{item.synopsis}}</td>
    </tr>
    {%endfor%}
</table>
</center>
{%endblock%}
