<!DOCTYPE html>
<html>
  <head>
    <title>Form | 42 Paris</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div style="display:flex; gap:40px;">
    <section style="flex:1;">
    <h1>Frontend</h1>
    <ol>
        <li>HTML5</li>
        <div style="position:relative;">
      <progress value="0.8"></progress>
      <span style="position:absolute; left:80%; top:0; transform:translateX(-100%);">80%</span>
        </div>
        <li>CSS3</li>
        <div style="position:relative;">
      <progress value="0.6"></progress>
      <span style="position:absolute; left:60%; top:0; transform:translateX(-100%);">60%</span>
        </div>
        <li>jQuery</li>
        <div style="position:relative;">
      <progress value="0.5"></progress>
      <span style="position:absolute; left:50%; top:0; transform:translateX(-100%);">50%</span>
        </div>
    </ol>
    </section>
     <section style="flex:1;">
    <h2>Backend</h2>
    <ol>
        <li>Python</li>
        <div style="position:relative;">
      <progress value="0.75"></progress>
      <span style="position:absolute; left:75%; top:0; transform:translateX(-100%);">75%</span>
        </div>
        <li>PHP</li>
        <div style="position:relative;">
      <progress value="0.65"></progress>
      <span style="position:absolute; left:65%; top:0; transform:translateX(-100%);">65%</span>
        </div>
        <li>Node.js</li>
        <div style="position:relative;">
      <progress value="0.35"></progress>
      <span style="position:absolute; left:35%; top:0; transform:translateX(-100%);">35%</span>
        </div>
    </ol>
    </section>
    </div>
  </body>
</html>
